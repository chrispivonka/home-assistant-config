  mode: single
- id: '1789010420472'
  alias: Cat Water Fountain - Low Water Alert
  description: Notify when pump power draw indicates the fountain is running low or
    dry
  triggers:
  - trigger: state
    entity_id: binary_sensor.cat_water_fountain_low_water
    to: 'on'
    for:
      minutes: 5
  conditions: []
  actions:
  - action: notify.mobile_app_chris_iphone
    data:
      title: Cat Water Fountain
      message: Water level looks low. Pump power draw has been elevated for 5+ minutes,
        suggesting it is running dry. Time for a refill.
  - action: notify.mobile_app_jacquelyns_iphone
    data:
      title: Cat Water Fountain
      message: Water level looks low. Pump power draw has been elevated for 5+ minutes,
        suggesting it is running dry. Time for a refill.
  mode: single
