- id: '1788381318253'
  alias: Low Battery Alert
  description: ''
  triggers:
  - trigger: template
    value_template: '{% set ns = namespace(low=[]) %}{% for s in states.sensor %}{%
      if s.attributes.device_class is defined and s.attributes.device_class == ''battery''
      and s.state not in [''unknown'',''unavailable''] and s.state | float(100) <
      20 %}{% set ns.low = ns.low + [s.name] %}{% endif %}{% endfor %}{{ ns.low |
      count > 0 }}'
  conditions: []
  actions:
  - action: notify.mobile_app_chris_iphone
    metadata: {}
    data:
      message: '{% set ns = namespace(low=[]) %}{% for s in states.sensor %}{% if
        s.attributes.device_class is defined and s.attributes.device_class == ''battery''
        and s.state not in [''unknown'',''unavailable''] and s.state | float(100)
        < 20 %}{% set ns.low = ns.low + [s.name] %}{% endif %}{% endfor %}{{ ns.low
        | join('', '') }} low on battery.'
      title: Low Battery Alert
  mode: single
- id: '1788390482588'
  alias: Device Offline Alert
  description: ''
  triggers:
  - trigger: template
    value_template: '{% set relevant = [''binary_sensor'',''light'',''switch'',''lock'',''climate'',''cover'',''media_player'']
      %}{{ states | selectattr(''domain'',''in'', relevant) | selectattr(''state'',''eq'',''unavailable'')
      | rejectattr(''entity_id'', ''search'', ''iphone|living_room_camera|office_camera|master_bedroom_camera'')
      | list | count > 0 }}'
    for:
      minutes: 15
  conditions: []
  actions:
  - action: notify.mobile_app_chris_iphone
    data:
      title: Device Offline
      message: '{% set relevant = [''binary_sensor'',''light'',''switch'',''lock'',''climate'',''cover'',''media_player'']
        %}{{ states | selectattr(''domain'',''in'', relevant) | selectattr(''state'',''eq'',''unavailable'')
        | rejectattr(''entity_id'', ''search'', ''iphone|living_room_camera|office_camera|master_bedroom_camera'')
        | map(attribute=''name'') | join('', '') }} offline for 15+ minutes.'
  mode: single
- id: '1788390521607'
  alias: Backup Failed Alert
  description: ''
  triggers:
  - trigger: state
    entity_id: event.backup_automatic_backup
    attribute: event_type
    to: failed
  conditions: []
  actions:
  - action: notify.mobile_app_chris_iphone
    data:
      title: Backup Failed
      message: The automatic Home Assistant backup failed. Check Settings > System
        > Backups.
  mode: single
- id: '1788390566691'
  alias: Doorbell Notifications
  description: ''
  triggers:
  - trigger: state
    entity_id: event.doorbell
    id: ring
  - trigger: state
    entity_id: binary_sensor.doorbell_person
    to: 'on'
    id: person
  conditions: []
  actions:
  - action: notify.mobile_app_chris_iphone
    data:
      title: '{{ ''Doorbell'' if trigger.id == ''ring'' else ''Person at Door'' }}'
      message: '{{ ''Someone rang the doorbell.'' if trigger.id == ''ring'' else ''Person
        detected at the front door.'' }}'
      data:
        image: /api/camera_proxy/camera.doorbell
  mode: queued
  max: 10
- id: '1788390608848'
  alias: Lights Left On When Away
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - person.chris
    - person.jackie
    to: not_home
  conditions:
  - condition: template
    value_template: '{{ states.person | selectattr(''state'',''eq'',''home'') | list
      | count == 0 }}'
  - condition: template
    value_template: '{{ states.light | selectattr(''state'',''eq'',''on'') | list
      | count > 0 }}'
  actions:
  - action: notify.mobile_app_chris_iphone
    data:
      title: Lights Left On
      message: '{{ states.light | selectattr(''state'',''eq'',''on'') | map(attribute=''name'')
        | join('', '') }} left on - everyone''s away.'
  mode: single
- id: '1788479928048'
  alias: Wine Fridge Door Left Open
  description: ''
  triggers:
  - trigger: state
    entity_id: binary_sensor.eve_door_20ebn9901_door
    to: 'on'
