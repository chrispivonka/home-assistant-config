- id: master_closet_lights_on
  alias: Master Closet - Turn on lights on motion
  trigger:
  - platform: state
    entity_id: binary_sensor.eve_motion_20eby9901_occupancy_2
    to: 'on'
  action:
  - choose:
    - conditions:
      - condition: sun
        after: sunset
        before: sunrise
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.ceiling_light
          - light.master_closet
        data:
          brightness_pct: 5
    default:
    - action: light.turn_on
      target:
        entity_id:
        - light.ceiling_light
        - light.master_closet
      data:
        brightness_pct: 100
  mode: single
- id: master_closet_lights_off
  alias: Master Closet - Turn off lights after no motion
  trigger:
  - platform: state
    entity_id: binary_sensor.eve_motion_20eby9901_occupancy_2
    to: 'off'
    for:
      minutes: 5
  - platform: state
    entity_id: light.master_closet
    to: 'on'
    for:
      minutes: 15
  action:
  - action: light.turn_off
    target:
      entity_id:
      - light.ceiling_light
      - light.master_closet
  mode: single
