
# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  external_url: "https://home-assistant.local"
  internal_url: "https://home-assistant.local"

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  server_port: 8123
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1
  ip_ban_enabled: true
  login_attempts_threshold: 5

bluetooth:

recorder:
  purge_keep_days: 10
  exclude:
    domains:
      - update
    entity_globs:
      - sensor.*_signal_strength
      - sensor.*_rssi

shell_command:
  check_docker_updates: "cat /config/docker_updates_status.txt"
